# Livox Mid-40 规格参考；圆锥内连续双频花瓣轨迹，不复刻真实覆盖率/发射标定表。
# https://www.livoxtech.com/mid-40-and-mid-100/specs
# 近距限制参考官方 Mid-40 Quick Start Guide；小于1 m不能测量。
lidar:
  publish_range_boundary: true     # 空旷/超量程方向显示最大距离辅助点；独立 range_boundary 话题，非实际回波。
  scan_pattern: rosette            # 非重复花瓣式扫描，光轴为 lidar_link 的 +x。
  scan_mode: rolling               # 逐点时间；轨迹跨帧连续，不从头重复花瓣。
  rate_hz: 10.0                    # 仿真封包频率，自选值；不是机械旋转频率。
  columns: 10000                   # 厂家 100000 点/s ÷10 Hz。
  rings: 1                        # 合成通道 ring=0，不是物理扫描线编号。
  cone_half_angle_deg: 19.2        # 圆形视场总张角38.4°；不是38.4°×38.4°矩形。
  pattern_hz: 100.0                # 仿真双频参数，不是厂家镜片转速。
  min_range_m: 1.0                 # 近距限制 m，近处遮挡不会被穿透。
  max_range_m: 90.0                # 100 klx、10%反射率；20%为130 m，80%为260 m。
  range_sigma_m: 0.0  # 默认理想测距；通过 noise_config 注入误差。
  range_bias_m: 0.0                # m，固定距离偏差。
  dropout: 0.0                     # 额外独立丢点概率 [0,1]。
  ring_delays_s: []                # 非重复扫描不使用机械线束延时。
  point_layout: xyzirt_v1          # PointCloud2，不模拟厂家 UDP 或 CustomMsg。
  self_filter: robot               # 排除本车外壳。
  excluded_links: []               # self_filter=links 时使用。
