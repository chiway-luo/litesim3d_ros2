name: M1-M3 Ubuntu Humble
on: [push, pull_request, workflow_dispatch]
jobs:
  m1_m3:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 45
    env:
      LITESIM3D_ARTIFACTS_DIR: /tmp/litesim3d_ros2-artifacts
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      MAKEFLAGS: '-j2'
    steps:
      - uses: actions/checkout@v4
      - name: Install declared dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake pkg-config ninja-build \
            python3-colcon-common-extensions python3-rosdep ros-humble-xacro \
            xvfb xauth libgl1-mesa-dri
          rosdep update --rosdistro humble
          rosdep install --from-paths . --ignore-src --rosdistro humble -y
      - name: Check repository documentation
        run: |
          python3 scripts/checks/check_repository_docs.py
          python3 scripts/checks/check_api_docs.py
          python3 -m unittest discover -s scripts/checks -p test_documentation_checks.py
      - name: Build
        id: build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          bash scripts/build.sh
      - name: Run documented headless tutorials
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source "$(python3 scripts/paths.py install)/setup.bash"
          python3 scripts/checks/check_documented_tutorials.py \
            --output "$LITESIM3D_ARTIFACTS_DIR/evidence/documented-tutorials"
      - name: Run core and ROS regression tests
        id: regression
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          bash scripts/test_m3.sh
      - name: Upload regression failure evidence
        if: ${{ failure() && steps.regression.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-evidence
          path: ${{ env.LITESIM3D_ARTIFACTS_DIR }}/evidence/m3/
      - name: Test installed resources without the source tree
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python3 scripts/checks/check_m3_install.py
      - name: Verify RViz does not change simulation output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source "$(python3 scripts/paths.py install)/setup.bash"
          xvfb-run -a env LWS_PRIVATE_TEST_DISPLAY=1 python3 scripts/checks/check_gui_independence.py
      - name: Test camera rendering and desktop launch integration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 QT_X11_NO_MITSHM=1 bash scripts/test_desktop.sh
      - name: Upload actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-m3-test-evidence
          path: ${{ env.LITESIM3D_ARTIFACTS_DIR }}/evidence/

  release_packages:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install declared package dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake python3-colcon-common-extensions python3-rosdep
          rosdep update --rosdistro humble
          rosdep install --from-paths . --ignore-src --rosdistro humble -y
      - name: Verify each package without sibling sources
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python3 scripts/checks/check_versions.py
          python3 scripts/checks/check_release_packages.py --work-dir /tmp/litesim-release-check --jobs 2
      - name: Upload package validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-evidence
          path: |
            /tmp/litesim-release-check/validation.json
            /tmp/litesim-release-check/evidence/
            /tmp/litesim-release-check/build/**/test_results/
            /tmp/litesim-release-check/build/**/Testing/
