# Velodyne VLP-16 Rev-F 规格参考：16 线，360°×30°，100 m。
# 官方手册：https://data.ouster.io/downloads/velodyne/user-manual/vlp-16-user-manual-revf.pdf
# 10 Hz、0.2°采样得到 288000 槽/s，近似手册单回波约 289344 次/s。
# 不复刻 UDP 包、逐台标定、真实发射顺序或双回波；ring 按仰角升序排列。
lidar:
  publish_range_boundary: true     # 空旷/超量程方向显示最大距离辅助点；独立 range_boundary 话题，非实际回波。
  scan_pattern: spinning           # 固定多线环扫；静止无噪声时每帧可完全重合。
  scan_mode: rolling               # 每点按采样时间射线求交，包含运动畸变。
  rate_hz: 10.0                    # 一帧一周；此预设相当于 600 RPM。
  columns: 1800                    # 水平 0.2°；列数×16×10=288000 槽/s。
  rings: 16                       # 物理线束数，与下面数组长度一致。
  vertical_angles_deg: [-15, -13, -11, -9, -7, -5, -3, -1, 1, 3, 5, 7, 9, 11, 13, 15]
  horizontal_start_deg: -180.0     # 水平起点，围绕传感器 +z，0°指向 +x。
  horizontal_end_deg: 180.0        # 水平终点不取样；可裁剪到前向 [-90,90]。
  min_range_m: 1.0                 # 本预设使用 1 m 近距过滤，近处障碍仍遮挡后方。
  max_range_m: 100.0               # 规格量程上限；未模拟材质/天气导致的量程衰减。
  range_sigma_m: 0.0  # 默认理想测距；通过 noise_config 注入误差。
  range_bias_m: 0.0                # 固定距离偏差，m。
  dropout: 0.0                     # 额外独立丢点概率 [0,1]，不是无回波比例。
  ring_delays_s: []                # 简化为一列同时发射；并非真实发射时序。
  point_layout: xyzirt_v1          # 标准 PointCloud2，24 字节/槽。
  self_filter: robot               # 排除本车外壳。
  excluded_links: []               # self_filter=links 时使用。
