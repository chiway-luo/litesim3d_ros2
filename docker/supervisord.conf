[supervisord]
nodaemon=true
logfile=/dev/fd/1
logfile_maxbytes=0
pidfile=/tmp/litesim3d-supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/litesim3d-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/litesim3d-supervisor.sock

[program:display]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp +extension GLX -noreset
priority=10
autorestart=false
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:window-manager]
command=litesim-display openbox --sm-disable
priority=20
autorestart=false
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
command=litesim-display x11vnc -display :99 -localhost -rfbport 5900 -forever -shared -nopw -noxdamage
priority=20
autorestart=false
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=30
autorestart=false
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:simulation]
command=litesim-display dbus-run-session -- ros2 launch wheel_car_4w_sim wheel_car_4w.launch.py gui:=true rviz:=false cameras:=false lidar_profile:=vlp16 lidar_interface:=native
priority=40
autorestart=false
startretries=0
stopsignal=INT
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
