/**:
  ros__parameters:
    use_sim_time: true
/litesim3d:
  ros__parameters:
    # 出生位姿：世界坐标下的 base_link，[x, y, z, qx, qy, qz, qw]，位置单位 m。
    initial_pose_override: [-8.0, -8.0, 1.2, 0.0, 0.0, 0.0, 1.0]
    frame_prefix: ''
    cmd_mode: twist
    sensor_reliable: false
    publish_odom_tf: true
    external_odom_tf: false
    startup_timeout: 15.0
    start_paused: false
/robot_state_publisher:
  ros__parameters:
    publish_frequency: 200.0
/rviz2:
  ros__parameters:
    use_sim_time: true
