# 普通全向轮布局；车体 +x 前、+y 左、+z 上，不是麦克纳姆轮。
# 同一 wheels 列表同时供机械 Xacro、驱动与编码器解算使用。
wheels:
  # 第 0 轮：名称唯一；[x,y] 为轮心，m；方向为正滚动方向，rad。
  - joint: wheel_0_joint
    x_m: 0.3
    y_m: 0
    rolling_angle_rad: 1.570796326794897
    # 有效半径，m，>0；被动滚子放开与滚动方向垂直的运动。
    radius_m: 0.1
  # 第 1 轮：名称唯一；[x,y] 为轮心，m；方向为正滚动方向，rad。
  - joint: wheel_1_joint
    x_m: -0.1499999999999999
    y_m: 0.2598076211353316
    rolling_angle_rad: 3.665191429188092
    # 有效半径，m，>0；被动滚子放开与滚动方向垂直的运动。
    radius_m: 0.1
  # 第 2 轮：名称唯一；[x,y] 为轮心，m；方向为正滚动方向，rad。
  - joint: wheel_2_joint
    x_m: -0.1500000000000001
    y_m: -0.2598076211353315
    rolling_angle_rad: 5.759586531581287
    # 有效半径，m，>0；被动滚子放开与滚动方向垂直的运动。
    radius_m: 0.1
