# 必填：普通全向轮约束列表，包含每个独立 continuous 驱动关节；不支持麦克纳姆滚子模型。
# 车体 x 前、y 左、z 上；数组顺序无物理意义，但每个 joint 必须唯一。
# 三轮/四轮驱动插件分别要求恰好 3/4 项；里程计允许 3 或 4 项；约束矩阵必须满秩。
wheels:
  # 必填：独立驱动关节名称，必须存在于组合 URDF。
  - joint: wheel_0_joint
    # 必填：轮中心相对 base 的 x 坐标，m，有限实数；须与 URDF 一致。
    x_m: 0.3
    # 必填：轮中心相对 base 的 y 坐标，m，有限实数；须与 URDF 一致。
    y_m: 0
    # 必填：轮正向滚动方向相对 +x 的逆时针角，rad；正轴为 [-sin(a),cos(a),0]。
    rolling_angle_rad: 1.570796326794897
    # 必填：本轮有效半径，m，必须 > 0；被动滚子允许垂直于滚动方向的自由运动。
    radius_m: 0.1
  # 必填：独立驱动关节名称，必须存在于组合 URDF。
  - joint: wheel_1_joint
    # 必填：轮中心相对 base 的 x 坐标，m，有限实数；须与 URDF 一致。
    x_m: -0.1499999999999999
    # 必填：轮中心相对 base 的 y 坐标，m，有限实数；须与 URDF 一致。
    y_m: 0.2598076211353316
    # 必填：轮正向滚动方向相对 +x 的逆时针角，rad；正轴为 [-sin(a),cos(a),0]。
    rolling_angle_rad: 3.665191429188092
    # 必填：本轮有效半径，m，必须 > 0；被动滚子允许垂直于滚动方向的自由运动。
    radius_m: 0.1
  # 必填：独立驱动关节名称，必须存在于组合 URDF。
  - joint: wheel_2_joint
    # 必填：轮中心相对 base 的 x 坐标，m，有限实数；须与 URDF 一致。
    x_m: -0.1500000000000001
    # 必填：轮中心相对 base 的 y 坐标，m，有限实数；须与 URDF 一致。
    y_m: -0.2598076211353315
    # 必填：轮正向滚动方向相对 +x 的逆时针角，rad；正轴为 [-sin(a),cos(a),0]。
    rolling_angle_rad: 5.759586531581287
    # 必填：本轮有效半径，m，必须 > 0；被动滚子允许垂直于滚动方向的自由运动。
    radius_m: 0.1
# 编码器解算后的速度误差；位姿按每个实际时间段积分，reset 重置随机序列。
noise:
  # [x,y] 速度相对比例误差，无量纲，每项 > -1；0 理想，0.02 表示 +2%。
  linear_scale_error: [0.0, 0.0]
  # yaw 角速度相对比例误差，无量纲，> -1；0 理想。
  angular_scale_error: 0.0
  # 兼容旧配置：速度倍率，理想为 1；不能和非零 linear_scale_error 同时使用。
  linear_scale: [1.0, 1.0]
  # 车体 [x,y] 两方向速度偏置，m/s，有限实数；非零可造成静止漂移。
  linear_bias_mps: [0.0, 0.0]
  # 车体 [x,y] 两方向独立高斯速度噪声标准差，m/s，每项 >= 0。
  linear_sigma_mps: [0.0, 0.0]
  # 兼容旧配置：yaw 速度倍率，理想为 1；不能和非零 angular_scale_error 同时使用。
  angular_scale: 1.0
  # yaw 速度偏置，rad/s，有限实数。
  angular_bias_radps: 0.0
  # yaw 高斯速度噪声标准差，rad/s，必须 >= 0；seed 来自仿真。
  angular_sigma_radps: 0.0
