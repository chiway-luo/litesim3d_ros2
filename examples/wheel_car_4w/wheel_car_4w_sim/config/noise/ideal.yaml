# 四轮车理想测量。默认模型已使用这些值；此文件可显式恢复全部误差为 0。
# 只覆盖误差，不修改频率、挂载、话题、量程或相机开关。
odometry:
  linear_scale_error: [0.0, 0.0]  # [x,y] 相对误差；0.02 表示 +2%。
  angular_scale_error: 0.0
  linear_bias_mps: [0.0, 0.0]
  angular_bias_radps: 0.0
  linear_sigma_mps: [0.0, 0.0]
  angular_sigma_radps: 0.0
sensors:
  roof_lidar:
    range_bias_m: 0.0
    range_sigma_m: 0.0
    dropout: 0.0
  body_imu:
    accel_bias: [0.0, 0.0, 0.0]
    gyro_bias: [0.0, 0.0, 0.0]
    accel_sigma: [0.0, 0.0, 0.0]
    gyro_sigma: [0.0, 0.0, 0.0]
  front_camera:
    color_bias_dn: [0.0, 0.0, 0.0]
    color_sigma_dn: [0.0, 0.0, 0.0]
