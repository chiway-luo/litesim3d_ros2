# 公共 simulation.launch.py 读取这份文件；RSP 的参数单独放在 rsp.yaml。
/**:
  ros__parameters:
    use_sim_time: true  # 仿真节点和 RViz 使用 /clock 提供的仿真时间。
/litesim3d:
  ros__parameters:
    publish_odom_tf: false  # odom → base_link 交给 diff_drive_controller，关节 TF 交给 RSP。
    external_odom_tf: true  # 声明 odom TF 是否由外部节点负责；为 true 时必须关闭上项。
    start_paused: false  # false：启动后推进仿真；true：从暂停状态开始。
    lidar_interface: livox  # livox：Livox 接口；native：原生 PointCloud2；auto：自动选择。
    xfer_format: 1  # 仅 Livox 接口：1=CustomMsg（另带 RViz 点云），0=PointCloud2。
    livox_lidar_id: 0  # Livox 起始 ID；按雷达声明顺序递增，本例依次为 0、1，均须 ≤255。
