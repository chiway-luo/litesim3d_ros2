schema_version: 1
units: m_rad_s
simulation:
  step_size: 0.005
  seed: 42
  odom_rate: 50
  command_timeout: 0.5
  real_time_factor: 1.0
  threads: 4
robot:
  id: robot_0
  urdf: ../urdf/r01.urdf
  base_link: base_link
  motion_model: differential_drive
  initial_pose:
    xyz:
    - 0
    - 0
    - 0
    rpy:
    - 0
    - 0
    - 0
  drive:
    wheel_radius: 0.1
    wheel_separation: 0.5
    max_v: 1.0
    max_w: 2.0
    acceleration: 0.5
    deceleration: 1.0
    angular_acceleration: 2.0
    support_links:
    - left_wheel
    - right_wheel
lidars:
- name: lidar
  link: lidar_link
  topic: points_raw
  rate_hz: 10
  columns: 512
  rings: 16
  vertical_angles_deg:
  - -15
  - -13
  - -11
  - -9
  - -7
  - -5
  - -3
  - -1
  - 1
  - 3
  - 5
  - 7
  - 9
  - 11
  - 13
  - 15
  min_range_m: 0.1
  max_range_m: 100
  scan_mode: rolling
  point_layout: xyzirt_v1
  self_filter: sensor_link
imus:
- name: imu
  link: base_link
  topic: imu/data_raw
  rate_hz: 200
terrain:
  enabled: true
  max_slope_deg: 20
  clearance_m: 0
  continuity_m: 0.02
entities:
- id: ground
  pose:
    xyz:
    - 0
    - 0
    - -0.1
  geometry:
    type: box
    size:
    - 30
    - 30
    - 0.2
  support: true
- id: front_wall
  pose:
    xyz:
    - 5.005
    - 0
    - 1.5
  geometry:
    type: box
    size:
    - 0.01
    - 16
    - 3
- id: left_wall
  pose:
    xyz:
    - 0
    - 5
    - 1.5
  geometry:
    type: box
    size:
    - 10
    - 0.1
    - 3
- id: column
  pose:
    xyz:
    - 2.5
    - -2
    - 1
  geometry:
    type: cylinder
    radius: 0.3
    length: 2
- id: low_obstacle
  pose:
    xyz:
    - 2
    - 1
    - 0.2
  geometry:
    type: box
    size:
    - 0.6
    - 0.6
    - 0.4
- id: overhead
  pose:
    xyz:
    - 3
    - 0
    - 2
  geometry:
    type: box
    size:
    - 2
    - 3
    - 0.2
