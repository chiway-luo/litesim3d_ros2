    robot_state_publisher_name: robot_state_publisher
    startup_timeout: 15.0
    start_paused: false
/robot_state_publisher:
  ros__parameters:
    publish_frequency: 200.0
/rviz2:
  ros__parameters:
    use_sim_time: true
