name: Ubuntu Humble quality
on: [push, pull_request, workflow_dispatch]
jobs:
  quality:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: ${{ matrix.profile == 'asan' && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        profile: [functional, coverage, asan, tsan, release]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install declared dependencies and test tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake pkg-config ninja-build \
            python3-colcon-common-extensions python3-rosdep python3-pytest python3-coverage \
            clang-14 llvm-14 libunwind-14-dev ros-humble-rclcpp ros-humble-xacro xvfb xauth libgl1-mesa-dri
          rosdep update --rosdistro humble
          rosdep install --from-paths . --ignore-src --rosdistro humble -y
      - name: Run the shared Ubuntu entry point
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python3 scripts/test_ubuntu.py --profile "${{ matrix.profile }}" --output /tmp/litesim-quality --jobs 2
      - name: Upload actual evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.profile }}-${{ runner.arch }}
          path: |
            /tmp/litesim-quality/summary.json
            /tmp/litesim-quality/${{ matrix.profile }}/latest.json
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/*.json
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/*.jsonl
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/*.log
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/*.xml
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/coveragerc
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/asan.*
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/ubsan.*
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/tsan.*
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/artifacts/evidence/
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/coverage/
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/profiles/
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/positive-control/*.json
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/positive-control/*.log
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/positive-control/render/*.json
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/positive-control/render/*.log
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/tutorials/
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/ros_logs/
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/packages/validation.json
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/packages/evidence/
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/packages/build/**/test_results/
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/packages/build/**/Testing/
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/bridge-only/validation.json
            /tmp/litesim-quality/${{ matrix.profile }}/runs/*/bridge-only/evidence/
          retention-days: 14
