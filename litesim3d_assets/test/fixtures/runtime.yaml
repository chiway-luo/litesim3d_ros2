entity_bindings:
  ground:
    support: true
    reflectivity: 0.35
mimic_joints:
  front_left_wheel_joint:
    joint: rear_left_wheel_joint
    multiplier: 1.0
  front_right_wheel_joint:
    joint: rear_right_wheel_joint
    multiplier: 1.0
