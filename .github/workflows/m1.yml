name: M1-M3 Ubuntu Humble
on: [push, pull_request, workflow_dispatch]
jobs:
  m1_m3:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 30
    env:
      LITESIM3D_ARTIFACTS_DIR: /tmp/litesim3d_ros2-artifacts
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install declared dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake pkg-config ninja-build \
            libeigen3-dev liburdfdom-dev libassimp-dev libfcl-dev libyaml-cpp-dev libtinyxml2-dev \
            libssl-dev nlohmann-json3-dev libgtest-dev libpcl-dev python3-colcon-common-extensions \
            python3-pytest python3-yaml python3-psutil ros-humble-robot-state-publisher ros-humble-rviz2 \
            ros-humble-xacro ros-humble-tf2-ros ros-humble-launch-testing ros-humble-ament-cmake-pytest \
            xvfb xauth libgl1-mesa-dri python3-pyqt5
      - name: Check repository documentation
        run: python3 scripts/checks/check_repository_docs.py
      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          bash scripts/build.sh
          bash scripts/test_m3.sh
      - name: Test installed resources without the source tree
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          python3 scripts/checks/check_m3_install.py
      - name: Verify RViz does not change simulation output
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source "$(python3 scripts/paths.py install)/setup.bash"
          xvfb-run -a python3 scripts/checks/check_gui_independence.py
      - name: Upload actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-m3-test-evidence
          path: ${{ env.LITESIM3D_ARTIFACTS_DIR }}/evidence/
