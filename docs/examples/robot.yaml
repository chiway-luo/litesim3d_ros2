# 接入手册的完整单机器人示例。先构建并 source 安装环境，再运行。
schema_version: 1
units: m_rad_s
simulation:
  step_size: 0.005
  seed: 42
  odom_rate: 50
  command_timeout: 0.5
  real_time_factor: 1.0
  threads: 2
robot:
  id: robot_0
  urdf: package://litesim3d_core/urdf/r01.urdf
  base_link: base_link
  motion_model: differential_drive
  initial_pose: {xyz: [0, 0, 0], rpy: [0, 0, 0]}
  drive:
    wheel_radius: 0.1
    wheel_separation: 0.5
    left_joint: left_wheel_joint
    right_joint: right_wheel_joint
    support_links: [left_wheel, right_wheel]
    max_v: 1.0
    max_w: 2.0
    acceleration: 0.5
    deceleration: 1.0
    angular_acceleration: 2.0
terrain:
  enabled: false
lidars:
  - name: lidar
    link: lidar_link
    topic: points_raw
    rate_hz: 10
    columns: 512
    rings: 16
    vertical_angles_deg: [-15, -13, -11, -9, -7, -5, -3, -1, 1, 3, 5, 7, 9, 11, 13, 15]
    min_range_m: 0.1
    max_range_m: 50.0
    scan_mode: rolling
    point_layout: xyzirt_v1
    self_filter: sensor_link
imus:
  - name: imu
    link: base_link
    topic: imu/data_raw
    rate_hz: 200
odom:
  mode: ideal
entities:
  - id: ground
    pose: {xyz: [0, 0, -0.1]}
    geometry: {type: box, size: [30, 30, 0.2]}
    support: true
  - id: front_wall
    pose: {xyz: [6, 0, 1.5]}
    geometry: {type: box, size: [0.1, 16, 3]}
    reflectivity: 0.8
  - id: column
    pose: {xyz: [3, -2, 1]}
    geometry: {type: cylinder, radius: 0.3, length: 2}
    reflectivity: 0.5
