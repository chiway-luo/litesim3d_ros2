# 此文件是机械 Xacro、底盘插件和里程计插件的共同几何来源。
common:
  # 普通轮半径，m，>0；所有四轮相同。
  wheel_radius_m: 0.1
  # 后轴到前轴距离，m，>0；base_link 位于后轴中点的地面投影。
  wheelbase_m: 0.6
  # 左右轮中心距，m，>0；+y 为左。
  track_width_m: 0.4
  # 后轴独立编码器关节；正轴 +y，正转沿 +x 前进。
  rear_left_joint: rear_left_wheel_joint
  rear_right_joint: rear_right_wheel_joint
  # 前轮独立转向关节；正轴 +z，正角左转。
  left_steering_joint: left_steering_joint
  right_steering_joint: right_steering_joint
  # 实际内轮转角上限，rad，(0,pi/2)。Xacro 限位也引用此值。
  max_steering_rad: 0.6
drive:
  # 前轮旋转关节，直接位于对应转向 link 下。
  front_left_joint: front_left_wheel_joint
  front_right_joint: front_right_wheel_joint
