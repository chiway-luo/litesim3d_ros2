# 本车型的实例覆盖；未列参数采用各插件完整参数文件的实际默认值。
lidar:
  # 每帧方位列数；16 线对应 8192 点。
  columns: 512
  # 机械线束仰角，度；环数由数组长度推导。
  vertical_angles_deg: [-15, -13, -11, -9, -7, -5, -3, -1, 1, 3, 5, 7, 9, 11, 13, 15]
  # 最大回波距离，m，必须大于最小量程。
  max_range_m: 50.0
  # rolling 按每点采样时刻取真实车体位姿。
  scan_mode: rolling
  # 排除整车；不会把空转里程计姿态用于测距。
  self_filter: robot
  # 高斯量程噪声标准差，m，>=0。
  range_sigma_m: 0.01
  # 在独立 range_boundary 话题发布量程可视化辅助点。
  publish_range_boundary: true
