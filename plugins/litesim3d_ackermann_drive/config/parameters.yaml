# 必填：后左 continuous 驱动轮关节，位于 [0,+轮距/2]，中立轴 +y。
rear_left_joint: rear_left_wheel_joint
# 必填：后右 continuous 驱动轮关节，位于 [0,-轮距/2]，中立轴 +y。
rear_right_joint: rear_right_wheel_joint
# 必填：前左 continuous 轮关节，位于 [轴距,+轮距/2]，必须直接属于左转向关节。
front_left_joint: front_left_wheel_joint
# 必填：前右 continuous 轮关节，位于 [轴距,-轮距/2]，必须直接属于右转向关节。
front_right_joint: front_right_wheel_joint
# 必填：左 revolute 转向关节，中立角 0，轴 +z；不得 mimic。
left_steering_joint: left_steering_joint
# 必填：右 revolute 转向关节，约定同左侧；两侧转角按同一转弯中心分别计算。
right_steering_joint: right_steering_joint
# 驱动速度限制；车体 x 前、y 左、z 上，正 yaw 绕 +z。
limits:
  # 平移速度向量模长上限，m/s，必须 > 0。
  max_linear_speed_mps: 1.0
  # 绕 +z 角速度绝对值上限，rad/s，必须 > 0。
  max_angular_speed_radps: 2.0
  # 平移加速度上限，m/s²，必须 > 0。
  acceleration_mps2: 0.5
  # 减速或反向时的平移加速度上限，m/s²，必须 > 0。
  deceleration_mps2: 1.0
  # yaw 角加速度上限，rad/s²，必须 > 0。
  angular_acceleration_radps2: 2.0
  # true：忽略加速度限制但保留速度与关节限制；false：使用上述加速度。
  unlimited_acceleration: false
